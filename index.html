<style>

:root{

}
@property --gx{syntax:"<percentage>";inherits:true;initial-value:70%}
@property --gy{syntax:"<percentage>";inherits:true;initial-value:38%}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--kr);-webkit-font-smoothing:antialiased;word-break:keep-all;
  -webkit-user-select:none;user-select:none;transition:--gx 1.8s var(--ease),--gy 1.8s var(--ease)}
body[data-page="0"]{--gx:72%;--gy:36%} body[data-page="1"]{--gx:30%;--gy:58%} body[data-page="2"]{--gx:22%;--gy:56%}
body[data-page="3"]{--gx:80%;--gy:24%} body[data-page="4"]{--gx:26%;--gy:62%} body[data-page="5"]{--gx:60%;--gy:30%} body[data-page="6"]{--gx:50%;--gy:50%}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;

  background-size:80px 80px;background-position:center;
  -webkit-mask-image:radial-gradient(ellipse 62% 58% at var(--gx) 62%,#000 6%,transparent 70%);mask-image:radial-gradient(ellipse 62% 58% at var(--gx) 62%,#000 6%,transparent 70%)}

/* ---------- 공통 ---------- */

  const pages = [...document.querySelectorAll(".pg")];
  const segs = document.getElementById("segs");
  const chNo = document.getElementById("chNo"), chTitle = document.getElementById("chTitle"), prog = document.getElementById("prog");
  const prev = document.getElementById("prev"), next = document.getElementById("next"), sweep = document.getElementById("sweep");
  const listeners = [];
  window.DECK = { i: 0, count: pages.length, on(fn){ listeners.push(fn); }, pages };

  PAGES.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "seg"; b.type = "button";
    b.innerHTML = pad(i + 1) + "<span></span>";

  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));

  let cur = -1, last = 0;
  function go(n){
    n = Math.max(0, Math.min(pages.length - 1, n));
    if (n === cur) return;
    const dir = n > cur ? 1 : -1, old = pages[cur];
    if (old){
      old.classList.remove("on"); old.classList.add("out"); setTimeout(() => old.classList.remove("out"), 520);
      sweep.classList.remove("go"); void sweep.offsetWidth; sweep.classList.add("go");
    }
    cur = n; window.DECK.i = n;
    const p = pages[n];
    p.scrollTop = 0; p.classList.add("on");
    document.body.dataset.page = n;
    chNo.textContent = "PAGE " + pad(n + 1) + " / " + pad(pages.length);

    prog.innerHTML = Math.round((n + 1) / pages.length * 100) + "<small>%</small>";
    segBtns.forEach((b, i) => { b.classList.toggle("on", i === n); b.classList.toggle("done", i < n); b.setAttribute("aria-current", i === n ? "step" : "false"); });
    prev.disabled = n === 0; next.disabled = n === pages.length - 1;
    listeners.forEach(fn => fn(n, dir));
  }
  window.DECK.go = go;
  prev.addEventListener("click", () => go(cur - 1));
  next.addEventListener("click", () => go(cur + 1));

  const toastEl = document.getElementById("toast"); let tt;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove("show"), 1800); }
  function fullscreen(){
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => toast("이 화면에서는 전체 화면을 쓸 수 없어요"));
      else document.exitFullscreen();
    } catch (_) { toast("이 화면에서는 전체 화면을 쓸 수 없어요"); }
  }
  document.getElementById("fs").addEventListener("click", fullscreen);

  addEventListener("keydown", e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (["ArrowRight","PageDown"," ","Enter","ArrowDown"].includes(k)){ e.preventDefault(); go(cur + 1); }
    else if (["ArrowLeft","PageUp","Backspace","ArrowUp"].includes(k)){ e.preventDefault(); go(cur - 1); }
    else if (k === "Home") go(0);
    else if (k === "End") go(pages.length - 1);
    else if (/^[1-9]$/.test(k) && +k <= pages.length) go(+k - 1);
    else if (k === "f" || k === "F") fullscreen();
  });
  addEventListener("wheel", e => {
    const p = pages[cur];
    if (p.scrollHeight > p.clientHeight + 4) return;      // 작은 화면에서 내용이 넘치면 스크롤 우선
    const now = Date.now();
    if (now - last < 1000 || Math.abs(e.deltaY) < 24) return;
    last = now; go(cur + (e.deltaY > 0 ? 1 : -1));
  }, { passive: true });
  let sx = 0, sy = 0;
  addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchend", e => {
    if (window.DECK.dragging) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });

  go(0);
  const loader = document.getElementById("loader");
  window.DECK.ready = () => loader.classList.add("done");
  setTimeout(window.DECK.ready, 5000);
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module">
/* =====================================================================
   3D 레이어 — Three.js r168 · 외부 모델 없이 코드로 모델링
   곡면 VR 헤드셋 · 게임패드 · 학과 캐릭터 · 트로피 · 토폴로지 큐브 · 파티클
   ===================================================================== */
(async () => {
const DECK = window.DECK;
const CDN = "https://cdn.jsdelivr.net/npm/three@0.168.0/";
let T, RoundedBoxGeometry, RoomEnvironment;
try {
  [T, { RoundedBoxGeometry }, { RoomEnvironment }] = await Promise.all([
    import(CDN + "+esm"),
    import(CDN + "examples/jsm/geometries/RoundedBoxGeometry.js/+esm"),
    import(CDN + "examples/jsm/environments/RoomEnvironment.js/+esm")

} catch (err) { console.warn("3D 레이어를 불러오지 못했습니다:", err); DECK.ready(); return; }

const gsap = window.gsap;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let renderer;
try { renderer = new T.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, alpha: true, powerPreference: "high-performance" }); }
catch (err) { console.warn("WebGL을 사용할 수 없습니다:", err); DECK.ready(); return; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xffffff, 0);
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.toneMapping = T.NeutralToneMapping;
renderer.toneMappingExposure = 1.02;

const scene = new T.Scene();
const pmrem = new T.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;
const world = new T.Group(); scene.add(world);

const camera = new T.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 10);
const key = new T.DirectionalLight(0xffffff, 1.6); key.position.set(4, 7, 8);
const rim = new T.DirectionalLight(0xbbd7f4, 1.8); rim.position.set(-7, 3, -5);
const under = new T.DirectionalLight(0xdde9f8, .5); under.position.set(0, -6, 4);
scene.add(key, rim, under, new T.HemisphereLight(0xe8f1fc, 0xffffff, .7));

/* ---------- 재질 ---------- */
const Pm = (o) => new T.MeshPhysicalMaterial(o);
const M = {
  white: Pm({ color: "#fdfeff", roughness: .26, clearcoat: 1, clearcoatRoughness: .14 }),
  pearl: Pm({ color: "#f4f8fd", roughness: .38, clearcoat: .6, sheen: .4, sheenColor: "#dbe9fa" }),
  navy: Pm({ color: "#183766", roughness: .26, metalness: .05, clearcoat: 1, clearcoatRoughness: .1 }),
  sky: Pm({ color: "#BBD7F4", roughness: .3, clearcoat: .9, clearcoatRoughness: .16 }),
  skyMetal: Pm({ color: "#cfe2f7", roughness: .18, metalness: .7, clearcoat: 1 }),
  visor: Pm({ color: "#0c1f40", roughness: .05, metalness: .3, clearcoat: 1, clearcoatRoughness: .02, iridescence: .55, iridescenceIOR: 1.35, iridescenceThicknessRange: [200, 600] }),
  fabric: Pm({ color: "#2a4a7c", roughness: .92, sheen: 1, sheenColor: "#a9c8ee", sheenRoughness: .5 }),
  cushion: Pm({ color: "#d4e4f6", roughness: .95, sheen: 1, sheenColor: "#ffffff", sheenRoughness: .4 }),
  glow: new T.MeshStandardMaterial({ color: "#d6e8fb", emissive: "#9fcaf6", emissiveIntensity: 1.6, roughness: .3 }),
  glass: Pm({ color: "#d8e8f9", roughness: .03, clearcoat: 1, transparent: true, opacity: .42, iridescence: 1, iridescenceIOR: 1.3, envMapIntensity: 1.6, depthWrite: false, side: T.DoubleSide }),
  line: new T.LineBasicMaterial({ color: "#183766", transparent: true, opacity: .8 }),
  lineSky: new T.LineBasicMaterial({ color: "#5D8BC9", transparent: true, opacity: .9 })
};
const V2 = (x, y) => new T.Vector2(x, y), V3 = (x, y, z) => new T.Vector3(x, y, z);
const mesh = (g, m, x = 0, y = 0, z = 0) => { const o = new T.Mesh(g, m); o.position.set(x, y, z); return o; };
const RB = (w, h, d, r, seg = 6) => new RoundedBoxGeometry(w, h, d, seg, r);
const lathe = (pts, seg = 64) => new T.LatheGeometry(pts.map(p => V2(p[0], p[1])), seg);
function roundRect(s, x, y, w, h, r){
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
}
// 원통면을 따라 휘게 (곡면 바이저)
function bend(geo, R){
  const p = geo.attributes.position, n = geo.attributes.normal;
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i), a = x / R, r = R + z;
    p.setX(i, r * Math.sin(a)); p.setZ(i, r * Math.cos(a) - R);
    const nx = n.getX(i), nz = n.getZ(i), c = Math.cos(a), s = Math.sin(a);
    n.setX(i, nx * c + nz * s); n.setZ(i, -nx * s + nz * c);
  }
  p.needsUpdate = n.needsUpdate = true; geo.computeBoundingBox(); return geo;
}
const bendPoint = (x, y, z, R) => { const a = x / R, r = R + z; return V3(r * Math.sin(a), y, r * Math.cos(a) - R); };

const softTex = (stops) => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  stops.forEach(([o, col]) => grd.addColorStop(o, col)); g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
};

const dotTex = softTex([[0, "rgba(255,255,255,1)"], [.35, "rgba(255,255,255,.85)"], [1, "rgba(255,255,255,0)"]]);

/* ---------- 계층: outer(배치) > inner(장면별 회전) > user(드래그) > float(대기 모션) > model ---------- */
const OBJ = {}, pickables = [];
function wrap(name, model, phase){
  const box = new T.Box3().setFromObject(model), size = V3(0, 0, 0), c = V3(0, 0, 0);
  box.getSize(size); box.getCenter(c);
  const k = 1.6 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(k); model.position.copy(c).multiplyScalar(-k);
  const float = new T.Group(); float.add(model);
  const user = new T.Group(); user.add(float);
  const inner = new T.Group(); inner.add(user);
  const outer = new T.Group(); outer.add(inner);
  const sh = new T.Mesh(new T.PlaneGeometry(1, 1), new T.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: .5 }));
  sh.scale.set(1.5, .3, 1); sh.position.set(0, -1.05, -.5); sh.renderOrder = -1; outer.add(sh);
  outer.scale.setScalar(0.0001); world.add(outer);
  const o = { name, outer, inner, user, float, sh, phase, hover: 0, vx: 0, vy: 0, on: false };
  model.traverse(m => { if (m.isMesh){ m.userData.obj = o; pickables.push(m); } });
  OBJ[name] = o;
}

    trophy: { x: -.7, y: -.44, s: .62, r: [.1, .4, 0] }, knot: { x: -.3, y: -.82, s: .3 }, glass: { x: .34, y: .78, s: .26 }, cube: { x: -.34, y: .8, s: .22, r: [.5, .65, .1] },

];
function halfDims(){ const hh = Math.tan(T.MathUtils.degToRad(camera.fov / 2)) * camera.position.z; return { hw: hh * camera.aspect, hh }; }
function respScale(){ const a = innerWidth / innerHeight; return a < .8 ? .5 : a < 1.25 ? .72 : 1; }
function resolve(L){
  const { hw, hh } = halfDims();
  if (L.el){
    const el = document.querySelector(L.el);
    if (el){
      const r = el.getBoundingClientRect();
      if (r.width > 0 && r.height > 0){
        const px = r.left + r.width * (L.ax ?? .5), py = r.top + r.height * (L.ay ?? .5);
        return { x: (px / innerWidth * 2 - 1) * hw, y: -(py / innerHeight * 2 - 1) * hh, s: (L.fit || .7) * (r.height / innerHeight * hh * 2) / 1.6, r: L.r || [0, 0, 0] };
      }
    }
    return null;                                   // 작은 화면에서 숨겨진 자리는 오브젝트도 숨김
  }
  return { x: L.x * hw, y: L.y * hh, s: (L.s || 0) * respScale(), r: L.r || [0, 0, 0] };
}
function apply(i, dur){
  const lay = LAYOUT[i] || {}, d = reduce ? 0 : dur;
  Object.values(OBJ).forEach((o, j) => {
    const t = lay[o.name] ? resolve(lay[o.name]) : null, dl = d ? j * .03 : 0;
    if (t){
      o.on = true;
      gsap.to(o.outer.position, { x: t.x, y: t.y, z: 0, duration: d, ease: "expo.inOut", delay: dl, overwrite: true });
      gsap.to(o.outer.scale, { x: t.s, y: t.s, z: t.s, duration: d, ease: "expo.inOut", delay: dl, overwrite: true });
      gsap.to(o.inner.rotation, { x: t.r[0], y: t.r[1], z: t.r[2], duration: d * 1.1, ease: "power3.inOut", overwrite: true });
    } else {
      o.on = false;
      gsap.to(o.outer.scale, { x: .0001, y: .0001, z: .0001, duration: d * .6, ease: "power3.in", overwrite: true });
      gsap.to(o.outer.position, { y: o.outer.position.y - .6, duration: d * .6, ease: "power3.in", overwrite: true });
    }
  });
}
// 장면 전환 시 카메라가 살짝 돌아 들어가는 느낌 (월드 스윙 + 파티클 흐름)
function swing(dir){
  if (reduce) return;
  gsap.timeline({ overwrite: true })
    .to(world.rotation, { y: dir * .09, duration: .7, ease: "power2.out" })
    .to(world.rotation, { y: 0, duration: 1.3, ease: "power3.inOut" });
  gsap.fromTo(particles.position, { x: 0 }, { x: -dir * 1.4, duration: 2, ease: "power3.out", onComplete(){ particles.position.x = 0; } });
}
let cur = DECK.i, settleT;
DECK.on((n, dir) => { cur = n; apply(n, 1.6); swing(dir || 1); clearTimeout(settleT); settleT = setTimeout(() => apply(cur, .6), 1650); });

const ray = new T.Raycaster(), ndc = new T.Vector2(-9, -9), mouse = { x: 0, y: 0 }, cam = { x: 0, y: 0 };
let hover = null, drag = null, lx = 0, ly = 0;
const uiHit = (el) => el && el.closest && el.closest("button, a, .seg, .nav");
const pick = () => { ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(pickables.filter(m => m.userData.obj.on), false); return h.length ? h[0].object.userData.obj : null; };
addEventListener("pointermove", e => {
  mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = e.clientY / innerHeight * 2 - 1; ndc.set(mouse.x, -mouse.y);
  if (drag){
    const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    drag.vy = dx * .012; drag.vx = dy * .008;
    drag.user.rotation.y += drag.vy; drag.user.rotation.x = T.MathUtils.clamp(drag.user.rotation.x + drag.vx, -.9, .9);
    return;
  }
  hover = uiHit(e.target) ? null : pick();
  document.body.classList.toggle("grab", !!hover);
});
addEventListener("pointerdown", e => { if (uiHit(e.target) || !hover) return; drag = hover; DECK.dragging = true; lx = e.clientX; ly = e.clientY; document.body.classList.add("grabbing"); });
addEventListener("pointerup", () => { if (drag){ drag = null; setTimeout(() => DECK.dragging = false, 50); document.body.classList.remove("grabbing"); } });
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); apply(cur, 0); });

/* ---------- 렌더 루프 ---------- */
const clock = new T.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (!reduce){
    cam.x += (mouse.x * .3 - cam.x) * .04; cam.y += (-mouse.y * .18 - cam.y) * .04;
    camera.position.x = cam.x; camera.position.y = cam.y; camera.lookAt(0, 0, 0);
    for (let i = 0; i < PN; i++){ let y = pPos[i * 3 + 1] + pSpd[i] * dt; if (y > 5.5) y = -5.5; pPos[i * 3 + 1] = y; }
    pGeo.attributes.position.needsUpdate = true;
  }
  Object.values(OBJ).forEach(o => {
    const b = reduce ? 0 : Math.sin(t * .85 + o.phase);
    o.hover += ((o === hover || o === drag ? 1 : 0) - o.hover) * .1;
    o.float.position.y = b * .07 + o.hover * .08;
    if (!reduce){ o.float.rotation.y = Math.sin(t * .42 + o.phase) * .2; o.float.rotation.x = Math.sin(t * .33 + o.phase * 1.7) * .06; }
    o.user.scale.setScalar(1 + o.hover * .06);
    if (o !== drag){
      o.vy *= .92; o.vx *= .9; o.user.rotation.y += o.vy; o.user.rotation.x += o.vx;
      if (Math.abs(o.vy) < .002){ o.user.rotation.y *= .975; o.user.rotation.x *= .96; }
    }
    const k = 1 - b * .08 - o.hover * .12; o.sh.scale.set(1.5 * k, .3 * k, 1); o.sh.material.opacity = .48 - b * .1 - o.hover * .12;
  });
  renderer.render(scene, camera);
});
renderer.render(scene, camera);
DECK.ready();
apply(cur, 1.9);
})();
</script>
